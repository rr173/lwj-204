<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>结构力学分析器 - 桁架/刚架</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-container">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="mode-group">
          <button id="btn-mode-truss" class="btn btn-mode active">桁架</button>
          <button id="btn-mode-frame" class="btn btn-mode">刚架</button>
        </div>
        <button id="btn-solve" class="btn btn-primary">求解当前工况</button>
        <button id="btn-solve-all" class="btn btn-primary">全部求解</button>
        <button id="btn-modal" class="btn btn-modal">模态分析</button>
        <button id="btn-clear" class="btn">清空</button>
        <button id="btn-undo" class="btn" title="Ctrl+Z">撤销</button>
        <button id="btn-redo" class="btn" title="Ctrl+Y">重做</button>
        <button id="btn-export" class="btn">导出JSON</button>
        <button id="btn-report" class="btn btn-primary" disabled>生成报告</button>
      </div>
      <div class="toolbar-right">
        <div class="view-mode-group">
          <button id="btn-view-single" class="btn active">单工况视图</button>
          <button id="btn-view-envelope" class="btn">包络视图</button>
        </div>
        <div id="frame-diagram-section" class="diagram-group" style="display:none;">
          <button id="btn-diagram-moment" class="btn active">弯矩图</button>
          <button id="btn-diagram-shear" class="btn">剪力图</button>
          <button id="btn-diagram-axial" class="btn">轴力图</button>
        </div>
        <label>
          位移放大系数:
          <input type="number" id="scale-factor" value="100" min="1" max="1000" step="10" />
        </label>
        <label id="modal-scale-label" style="display:none;">
          振型放大系数:
          <input type="number" id="modal-scale-factor" value="50" min="1" max="500" step="10" />
        </label>
      </div>
    </div>
    
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <div id="context-menu" class="context-menu hidden">
        <div class="menu-items"></div>
      </div>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="status-bar" class="status-bar"></div>
    </div>
    
    <div class="info-panel">
      <div class="panel-section">
        <h3>工况管理</h3>
        <div class="loadcase-header">
          <button id="btn-add-loadcase" class="btn btn-small">+ 新建工况</button>
        </div>
        <div id="loadcase-list" class="loadcase-list"></div>
      </div>
      <div class="panel-section" id="envelope-section" style="display:none;">
        <h3>包络结果</h3>
        <div id="envelope-summary"></div>
        <div id="overlimit-list"></div>
      </div>
      <div class="panel-section">
        <h3>图例</h3>
        <div class="legend-item">
          <span class="legend-color" style="background: #1e88e5"></span>
          <span>拉力 (Tension)</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #e53935"></span>
          <span>压力 (Compression)</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #9e9e9e"></span>
          <span>零力杆</span>
        </div>
        <div class="legend-item">
          <span class="legend-line" style="border-style: dashed"></span>
          <span>变形图</span>
        </div>
        <div class="legend-item">
          <span class="legend-line" style="border-top: 4px dashed #ffc107"></span>
          <span>应力超限警告</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: rgba(76, 175, 80, 0.3); border: 2px solid #4caf50;"></span>
          <span>弯矩图</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: rgba(33, 150, 243, 0.3); border: 2px solid #2196f3;"></span>
          <span>剪力图</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: rgba(244, 67, 54, 0.3); border: 2px solid #f44336;"></span>
          <span>轴力图</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #9c27b0;"></span>
          <span>均布荷载</span>
        </div>
        <div class="legend-item">
          <span class="legend-circle" style="border: 2px solid #ff9800;"></span>
          <span>铰接释放</span>
        </div>
        <div class="legend-item">
          <span class="legend-line" style="border-top: 3px solid #7b1fa2;"></span>
          <span>振型动画</span>
        </div>
        <div class="legend-item">
          <span class="legend-line" style="border-top: 2px dashed rgba(156,39,176,0.4);"></span>
          <span>振型包络</span>
        </div>
      </div>
      <div class="panel-section">
        <h3>操作说明</h3>
        <ul>
          <li>点击空白处创建节点</li>
          <li>从节点拖拽到另一节点创建杆件</li>
          <li>右键节点设置支座和荷载</li>
          <li>右键杆件设置材料属性</li>
          <li>刚架模式下右键杆件可释放铰接/设均布荷载</li>
          <li>拖拽移动节点</li>
          <li>框选后按Delete删除</li>
          <li>Ctrl+Z撤销, Ctrl+Y重做</li>
        </ul>
      </div>
      <div class="panel-section" id="results-section">
        <h3>求解结果</h3>
        <div id="results-content">点击"求解"按钮开始计算</div>
      </div>
      <div class="panel-section" id="modal-section" style="display:none;">
        <h3>模态分析结果</h3>
        <div class="modal-controls">
          <label>
            求解阶数:
            <input type="number" id="modal-num-modes" value="5" min="1" max="20" step="1" />
          </label>
        </div>
        <div id="modal-freq-list" class="modal-freq-list"></div>
        <button id="btn-modal-close" class="btn btn-small" style="margin-top:8px;">返回静力分析</button>
      </div>
    </div>
  </div>
  
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-confirm" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>
  
  <div id="report-overlay" class="report-overlay hidden">
    <div class="report-toolbar">
      <span class="report-toolbar-title">结构计算书 — 预览</span>
      <div class="report-toolbar-actions">
        <button id="btn-print-report" class="btn btn-primary">导出PDF</button>
        <button id="btn-close-report" class="btn">关闭</button>
      </div>
    </div>
    <div id="report-content" class="report-content"></div>
  </div>
  
  <script type="module" src="/main.js"></script>
</body>
</html>
